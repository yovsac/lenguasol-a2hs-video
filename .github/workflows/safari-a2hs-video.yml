name: Safari add-to-home-screen video
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  video:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ios: ["18es"]
    steps:
      - uses: actions/checkout@v4
      - name: List runtimes
        run: xcrun simctl list runtimes
      - name: Boot an iPhone simulator
        run: |
          V=${{ matrix.ios }}; V=${V%es}
          UDID=$(xcrun simctl list devices available -j | IOS=$V python3 -c "
          import json,sys,os
          d=json.load(sys.stdin)['devices']; want='iOS-'+os.environ['IOS']
          c=[(k,x) for k,v in d.items() if want in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c.sort(key=lambda kx: kx[0]); k,x=c[-1]; print(x['udid']); print(k, x['name'], file=sys.stderr)")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          if [[ "${{ matrix.ios }}" == *es ]]; then
            xcrun simctl spawn "$UDID" defaults write "Apple Global Domain" AppleLanguages -array es-ES
            xcrun simctl spawn "$UDID" defaults write "Apple Global Domain" AppleLocale -string es_ES
            xcrun simctl shutdown "$UDID"; xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          fi
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          mkdir -p out
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Warm up Safari and the share sheet (not recorded)
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --device "$UDID" test --test-output-dir out/warm .maestro/a2hs_warm_${{ matrix.ios }}.yaml || (sleep 15; maestro --device "$UDID" test --test-output-dir out/warm2 .maestro/a2hs_warm_${{ matrix.ios }}.yaml) || echo "WARM_FAILED" > out/warm_failed.txt
      - name: Record the flow
        env:
          VIDEO_PIN: ${{ secrets.VIDEO_PIN }}
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force out/a2hs_raw.mp4 &
          REC=$!
          sleep 3
          maestro --device "$UDID" test -e PIN="$VIDEO_PIN" --test-output-dir out/rec .maestro/a2hs_rec_${{ matrix.ios }}.yaml || echo "MAESTRO_FAILED" > out/maestro_failed.txt
          sleep 3
          kill -INT $REC; wait $REC || true
          xcrun simctl io "$UDID" screenshot out/final.png
          mv *.png out/ 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2hs-video-ios${{ matrix.ios }}
          path: |
            out/*.mp4
            out/**/*.png
          retention-days: 14
