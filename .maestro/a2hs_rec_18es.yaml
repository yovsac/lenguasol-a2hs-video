appId: com.apple.mobilesafari
---
- pressKey: home
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: r_start
- tapOn: "Safari"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: r_safari
- tapOn:
    point: "50%,88%"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: r_addr
- inputText: "app.lenguasol.net"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: r_typed
- pressKey: Enter
- extendedWaitUntil:
    visible: "Entrar.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "ShareButton"
- extendedWaitUntil:
    visible: "Copiar|Añadir a la lista de lectura|Mensajes|Mail"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: r_sheet
- scrollUntilVisible:
    element:
      text: "Añadir a pantalla de inicio"
    direction: DOWN
    timeout: 30000
    speed: 30
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Añadir a pantalla de inicio"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: r_add
- tapOn:
    text: "Añadir"
    index: 0
- waitForAnimationToEnd:
    timeout: 4000
- pressKey: home
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: r_home
- runFlow:
    when:
      notVisible: "Lenguasol.*"
    commands:
      - swipe:
          start: "85%,50%"
          end: "15%,50%"
      - waitForAnimationToEnd:
          timeout: 2500
- takeScreenshot: r_home2
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Lenguasol.*"
- extendedWaitUntil:
    visible: "Entrar.*"
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: r_app
# --- log in (video-only demo account) and switch on notifications
- tapOn: "tu móvil o usuario"
- waitForAnimationToEnd:
    timeout: 1500
- inputText: "video"
- tapOn:
    point: "50%,46%"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: ${PIN}
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: r_login
- tapOn: "Entrar.*"
- extendedWaitUntil:
    visible: "Chats"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: r_chats
- tapOn: "Menú"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: r_menu
- tapOn: "Notificaciones"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: r_prompt
- tapOn:
    text: "Permitir"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: r_after
- tapOn:
    text: "Menú"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: r_menu2
