appId: com.apple.mobilesafari
---
- pressKey: home
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: r_start
- tapOn: "Safari"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: r_safari
- tapOn:
    point: "50%,88%"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: r_addr
- inputText: "app.lenguasol.net"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: r_typed
- pressKey: Enter
- extendedWaitUntil:
    visible: "Entrar.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "ShareButton"
- extendedWaitUntil:
    visible: "Copy|Add to Reading List|Messages|Mail"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: r_sheet
- scrollUntilVisible:
    element:
      text: "Add to Home Screen"
    direction: DOWN
    timeout: 30000
    speed: 30
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Add to Home Screen"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: r_add
- tapOn:
    text: "Add"
    index: 0
- waitForAnimationToEnd:
    timeout: 4000
- pressKey: home
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: r_home
- runFlow:
    when:
      notVisible: "Lenguasol.*"
    commands:
      - swipe:
          start: "85%,50%"
          end: "15%,50%"
      - waitForAnimationToEnd:
          timeout: 2500
- takeScreenshot: r_home2
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Lenguasol.*"
- extendedWaitUntil:
    visible: "Entrar.*"
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: r_app
